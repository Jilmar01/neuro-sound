<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Sound Responsive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/commonelem.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>

    <div class="container-fluid h-100 p-0">
        <div class="row h-100 g-0">
            <div class="col-md-1 d-none d-md-block h-100">
                <div class="sidebar-container">
                    <div class="mb-5 mt-3"><i class="bi bi-vinyl fs-1 text-white"></i></div>
                    <ul class="list-unstyled d-flex flex-column gap-3 w-100 align-items-center">
                        <li id="nav-home" class="sidebar-item" onclick="cargarVista('home')">
                            <i class="bi bi-house-door-fill fs-4 text-white"></i><span class="small mt-1 text-white">Home</span>
                        </li>
                        <!--li class="sidebar-item"><i class="bi bi-music-note-list fs-4 text-white"></i><span class="small mt-1 text-white">Playlists</span></li-->
                        <li id="nav-settings" class="sidebar-item" onclick="cargarVista('settings')">
                            <div class="d-flex flex-column align-items-center w-100 text-white">
                                <i class="bi bi-gear-fill fs-4"></i><span class="small mt-1">Ajustes</span>
                            </div>
                        </li>
                        <li class="sidebar-item mt-auto mb-4" onclick="logout()">
                            <a href="#" class="text-decoration-none text-white d-flex flex-column align-items-center">
                                <i class="bi bi-box-arrow-left fs-4"></i><span class="small mt-1">Logout</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="col-12 col-md-11 d-flex flex-column h-100">
                <div class="flex-shrink-0">
                    <div class="header d-flex align-items-center justify-content-between">
                        <div class="logo d-flex align-items-center">
                            <h1 class="mb-0 fs-5 fw-bold text-white d-none d-sm-block">Neuro-Sound</h1>
                        </div>
                        <div id="spotifySearchInput" class="searchfield position-relative flex-grow-1 mx-3" style="max-width: 400px;">
                            <input id="spotifySearchInput" type="text" class="form-control ps-5 py-2" placeholder="Buscar...">
                            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-white"></i>
                        </div>
                        <div class="profile text-white">
                            <a href="#" onclick="cargarVista('settings')" class="text-white"><i class="bi bi-person-circle fs-2"></i></a>
                        </div>
                    </div>
                </div>

                <div class="row flex-grow-1 m-0 overflow-hidden">
                    <div class="col-12 col-md-9 h-100 p-0">
                        <div class="space h-100 p-3 d-flex flex-column" style="padding-bottom: 100px;"> 
                            <div id="app-content" class="content-area glass-panel p-4 h-100 overflow-auto">
                                <h2 class="mb-3">Explorar</h2>
                                <div class="row g-3" id="mainPanel"></div>
                                <div id="spotifySearchResults" class="mt-4"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3 d-none d-md-flex flex-column gap-3 p-3 pt-0 h-100">
                        <div class="glass-panel flex-grow-1 p-3 d-flex flex-column" style="min-height: 300px;">
                            <iframe src="chartsiframe.html" class="w-100 h-100 border-0" style="display: block;"></iframe>
                        </div>
                        
                        <div class="glass-panel p-3">
                            <div class="d-flex align-items-center gap-3 mb-2">
                                <img class="ui-track-cover" src="/assets/img/defaultcover.png" style="width:50px; height:50px; border-radius:8px;" />
                                <div>
                                    <h6 class="ui-track-name m-0">Track Name</h6>
                                    <small class="ui-track-artist opacity-75">Artist</small>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-center gap-3 fs-4 my-2">
                                <i id="btnPrevDesktop" class="bi bi-skip-backward-fill" style="cursor: pointer;"></i>
                                <i id="btnPlayDesktop" class="bi bi-play-circle-fill ui-play-btn" style="cursor: pointer;"></i>
                                <i id="btnNextDesktop" class="bi bi-skip-forward-fill" style="cursor: pointer;"></i>
                            </div>
                            
                            <div class="mt-3">
                                <div id="progressDesktop" class="progress" style="height: 6px; background: rgba(255,255,255,0.2); cursor: pointer;">
                                    <div class="progress-bar ui-track-progress" style="width:0%; background: rgba(255,255,255,0.8); transition: width 0.1s linear;"></div>
                                </div>
                                <div class="d-flex justify-content-between mt-2 small opacity-75">
                                    <span class="ui-current-time">0:00</span>
                                    <span class="ui-total-time">0:00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-player glass-panel d-md-none shadow-lg" 
        data-bs-toggle="offcanvas" 
        data-bs-target="#fullScreenPlayer" 
        style="cursor: pointer;">
        
        <div class="d-flex align-items-center gap-2">
            <img class="ui-track-cover" src="/assets/img/defaultcover.png" style="width:40px; height:40px; border-radius:5px; object-fit:cover;"> 
            <div class="lh-1">
                <p class="ui-track-name m-0 fw-bold small text-white">Track Name</p>
                <small class="ui-track-artist m-0 text-white-50" style="font-size: 0.7rem;">Artist</small>
            </div>
        </div>
        
        <div class="d-flex align-items-center gap-3 fs-3 z-index-high">
            <i id="btnPlayMobileMini" class="bi bi-play-fill text-white ui-play-btn"></i>
            <i id="btnNextMobileMini" class="bi bi-skip-forward-fill text-white"></i>
        </div>
        
        <div style="position:absolute; bottom:0; left:15px; right:15px; height:2px; background:rgba(255,255,255,0.3);">
            <div class="ui-track-progress" style="width:0%; height:100%; background:white;"></div>
        </div>
    </div>

    <nav class="navbar fixed-bottom mobile-navbar d-md-none justify-content-around bg-dark" style="border-top: 1px solid rgba(255,255,255,0.1);">
        
        <div id="mobile-nav-home" class="nav-link-mobile text-center text-white" onclick="cargarVista('home')" style="cursor: pointer;">
            <i class="bi bi-house-door-fill fs-4"></i>
            <div style="font-size: 0.7rem;">Home</div>
        </div>

        <div id="mobile-nav-charts" class="nav-link-mobile text-center text-white" style="cursor: pointer;" onclick="cargarVista('charts')">
            <i class="bi bi-bar-chart-fill fs-4"></i>
            <div style="font-size: 0.7rem;">Charts</div>
        </div>

        <a id="mobile-nav-settings" onclick="cargarVista('settings')" class="nav-link-mobile text-center text-white text-decoration-none" style="cursor: pointer;">
            <i class="bi bi-person-fill fs-4"></i>
            <div style="font-size: 0.7rem;">Perfil</div>
        </a>

        <a onclick="logout()" id="mobile-nav-logout" href="#" class="nav-link-mobile text-center text-white text-decoration-none" style="cursor: pointer;">
            <i class="bi bi-box-arrow-left fs-4"></i>
            <div style="font-size: 0.7rem;">Logout</div>
        </a>        

    </nav>

    <div class="offcanvas offcanvas-bottom h-100 glass-modal" tabindex="-1" id="fullScreenPlayer">
        <div class="offcanvas-header justify-content-center pb-0">
            <div class="d-flex flex-column align-items-center w-100" data-bs-dismiss="offcanvas" style="cursor: pointer;">
                <div style="width: 40px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 10px;"></div>
                <i class="bi bi-chevron-down text-white fs-4"></i>
            </div>
        </div>

        <div class="offcanvas-body d-flex flex-column justify-content-center px-4">
            <div class="flex-grow-1 d-flex align-items-center justify-content-center py-3">
                <div class="album-art-container shadow-lg">
                    <img class="img-fluid rounded-4 w-100 ui-track-cover" src="/assets/img/defaultcover.png" alt="Album Art">
                </div>
            </div>

            <div class="mb-4 mt-2">
                <h2 class="text-white fw-bold mb-1 ui-track-name">Track Name</h2>
                <p class="text-white-50 fs-5 mb-0 ui-track-artist">Artist</p>
            </div>

            <div class="mb-4">
                <input id="progressMobileFull" type="range" class="form-range custom-range ui-track-range" value="0">
                
                <div class="d-flex justify-content-between text-white-50 small mt-1">
                    <span class="ui-current-time">0:00</span>
                    <span class="ui-total-time">0:00</span>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-5 px-3">
                <i class="bi bi-shuffle fs-3 text-secondary"></i>
                
                <i id="btnPrevMobileFull" class="bi bi-skip-backward-fill fs-1 text-white"></i>
                
                <div id="btnPlayMobileFull" class="play-button-large bg-white rounded-circle d-flex align-items-center justify-content-center text-dark" style="width: 70px; height: 70px;">
                    <i class="bi bi-play-fill fs-1 ms-1 ui-play-btn"></i>
                </div>
                
                <i id="btnNextMobileFull" class="bi bi-skip-forward-fill fs-1 text-white"></i>
                <i class="bi bi-repeat fs-3 text-secondary"></i>
            </div>
            <div style="height: 30px;"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">import { generateHybridPlaylist } from '/js/Engine/neuroEngineController.js';</script>
    <!--script src="/js/recomendationSpotify.js"></script-->
    <script src="/js/config.js"></script>
    <script type="module" src="/js/router.js"></script>
    <script src="/js/settingsLogic.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/searchSpotify.js"></script>
    <script type="module" src="/js/uicontroller.js"></script>
    <script type="module" src="/js/recomendations.js"></script>
    <script type="module" src="/js/localPlayer.js"></script>
    <script type="module" src="/js/spotifyPlayer.js"></script>
    <script type="module" src="/js/playerEngine.js"></script>
    <script src="/js/refactored/checkSesion.js"></script>
    <script src="/js/refactored/logout.js"></script>
</body>
</html>
