<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Musical Personalizado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/form.css">
    <style>
        /* Estilos adicionales para los reproductores de audio */
        audio {
            width: 100%;
            margin-bottom: 10px;
        }
        .genre-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div id="section1" class="section active">
        <h2>1. Consentimiento</h2>
        <div class="question">
            <label>¿Acepta que sus respuestas se utilicen para personalizar su experiencia musical?</label>
            <select id="consent" class="form-select">
                <option value="Si">Sí</option>
                <option value="No">No</option>
            </select>
        </div>
        <button class="btn btn-primary mt-3" onclick="handleConsent()">Siguiente</button>
    </div>

    <div id="section2" class="section" style="display:none;">
        <button class="btn btn-outline-secondary mb-3" onclick="previousSection(2)"><i class="bi bi-arrow-left"></i> Atrás</button>
        <h2>2. Estado Emocional</h2>

        <div class="question mb-3">
            <label>2.1 ¿Cuál de estas emociones describe mejor cómo se siente ahora?</label>
            <select id="currentEmotion" class="form-select">
                <option value="tristeza">Tristeza</option>
                <option value="calma">Calma</option>
                <option value="felicidad">Felicidad</option>
                <option value="ira">Ira</option>
            </select>
        </div>

        <div class="question mb-3">
            <label>2.2 ¿Qué tan intensa es esta emoción? (1 = muy leve, 5 = muy fuerte)</label>
            <input id="emotionIntensity" type="range" class="form-range" min="1" max="5" step="1" value="1" oninput="document.getElementById('intensityVal').innerText = this.value">
            <div class="text-center fw-bold" id="intensityVal">3</div>
        </div>

        <button class="btn btn-primary" onclick="nextSection(2)">Siguiente</button>
    </div>

<div id="section3" class="section" style="display:none;">
        <button class="btn btn-outline-secondary mb-3" onclick="previousSection(3)"><i class="bi bi-arrow-left"></i> Atrás</button>
        <h2>3. Test de Tonos Puros</h2>

        <div class="question mb-4">
            <label>3.1 Escuche los siguientes tonos y califique cuánto le molestan (1 = Nada, 5 = Mucho):</label>
            
            <div class="mb-3 p-3 border rounded">
                <strong>Tono 1:</strong>
                <audio controls class="w-100 mb-2"></audio>
                <label class="form-label">Nivel de molestia:</label>
                <select id="molestia1" class="form-select">
                    <option value="1">1 - Nada molesto</option>
                    <option value="2">2 - Poco molesto</option>
                    <option value="3">3 - Moderado</option>
                    <option value="4">4 - Molesto</option>
                    <option value="5">5 - Muy molesto</option>
                </select>
            </div>

            <div class="mb-3 p-3 border rounded">
                <strong>Tono 2:</strong>
                <audio controls class="w-100 mb-2"></audio>
                <label class="form-label">Nivel de molestia:</label>
                <select id="molestia2" class="form-select">
                    <option value="1">1 - Nada molesto</option>
                    <option value="2">2 - Poco molesto</option>
                    <option value="3">3 - Moderado</option>
                    <option value="4">4 - Molesto</option>
                    <option value="5">5 - Muy molesto</option>
                </select>
            </div>

            <div class="mb-3 p-3 border rounded">
                <strong>Tono 3:</strong>
                <audio controls class="w-100 mb-2"></audio>
                <label class="form-label">Nivel de molestia:</label>
                <select id="molestia3" class="form-select">
                    <option value="1">1 - Nada molesto</option>
                    <option value="2">2 - Poco molesto</option>
                    <option value="3">3 - Moderado</option>
                    <option value="4">4 - Molesto</option>
                    <option value="5">5 - Muy molesto</option>
                </select>
            </div>
        </div>

        <div class="question mb-3">
            <label>3.2 ¿Qué tono le agradó más?</label>
            <select id="likedTone" class="form-select">
                <option value="tone1">Tono 1</option>
                <option value="tone2">Tono 2</option>
                <option value="tone3">Tono 3</option>
            </select>
        </div>

        <div class="question mb-3">
            <label>3.3 ¿Qué tono le desagradó más?</label>
            <select id="dislikedTone" class="form-select">
                <option value="tone4">Tono 1</option>
                <option value="tone5">Tono 2</option>
                <option value="tone6">Tono 3</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="nextSection(3)">Siguiente</button>
    </div>

    <div id="section4" class="section" style="display:none;">
        <button class="btn btn-outline-secondary mb-3" onclick="previousSection(4)"><i class="bi bi-arrow-left"></i> Atrás</button>
        <h2>4. Géneros Musicales Preferidos</h2>

        <div class="question mb-3">
            <label>Marque todos los que disfrute:</label>
            <div class="genre-grid mt-2">
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Blues"> <label>Blues</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Indie"> <label>Indie</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Reggae"> <label>Reggae</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Soul"> <label>Soul</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Ambient"> <label>Ambient</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="House"> <label>House</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Reggaeton"> <label>Reggaeton</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Rock"> <label>Rock</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Classical"> <label>Classical</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Pop"> <label>Pop</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Folk"> <label>Folk</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Metal"> <label>Metal</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="EDM"> <label>EDM</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Hip-Hop"> <label>Hip-Hop</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="K-Pop"> <label>K-Pop</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Country"> <label>Country</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="RnB"> <label>RnB</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Jazz"> <label>Jazz</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Lofi"> <label>Lofi</label></div>
                <div class="form-check"><input class="form-check-input genreCheck" type="checkbox" value="Gospel"> <label>Gospel</label></div>
            </div>
        </div>

        <div class="question mb-3">
            <label>4.1 Artista actual de interés:</label>
            <input type="text" id="currentArtist" class="form-control" placeholder="Dua Lipa, The Weeknd, etc.">
        </div>

        <div class="question mb-3">
            <label>4.2 Preferencia de tipo de canción:</label>
            <select id="tempoPref" class="form-select">
                <option value="muy lentas y solemnes">Muy lentas y solemnes</option>
                <option value="lentas y tranquilas">Lentas y tranquilas</option>
                <option value="ritmo moderado">Ritmo moderado</option>
                <option value="rapidas y animadas">Rápidas y animadas</option>
                <option value="muy rápidas e intensas">Muy rápidas e intensas</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="nextSection(4)">Siguiente</button>
    </div>

    <div id="section5" class="section" style="display:none;">
        <button class="btn btn-outline-secondary mb-3" onclick="previousSection(5)"><i class="bi bi-arrow-left"></i> Atrás</button>
        <h2>5. Intención Emocional</h2>

        <div class="question mb-3">
            <label>Seleccione lo que desea que la música haga por usted:</label>
            <select id="emotionalGoal" class="form-select">
                <option value="1">Mantener cómo me siento</option>
                <option value="2">Sentirme más feliz</option>
                <option value="3">Relajarme</option>
                <option value="4">Aumentar mi energía</option>
                <option value="5">Ayudarme a concentrarme</option>
            </select>
        </div>

        <button class="btn btn-success" onclick="sendData()">Finalizar y Enviar</button>
    </div>

</div>
<script src="/js/config.js"></script>
<script>
    // Variable global para almacenar la emoción seleccionada
let currentEmotion = "tristeza"; // Ahora usa palabras completas y minúsculas

    // Mapa para traducir la letra del archivo a la palabra completa
    const emotionMap = {
        'T': 'tristeza',
        'C': 'calma',
        'F': 'felicidad',
        'I': 'ira'
    };
    
    // 1. Lógica de Audio y Reproductor -----------------------------------------
    
    function getEmotionCodeFromFileName(fileName) {
        // 1. Buscamos la letra Mayúscula (T, C, F, I) antes del punto (.wav)
        // La regex busca: un espacio (\s), seguido de una letra T,C,F o I, seguido de un punto
        const regex = /\s([TCFI])\./;
        const match = fileName.match(regex);

        // 2. Si encontramos la letra (ej: "T"), devolvemos la palabra completa ("tristeza")
        if (match && match.length > 1) {
            const letraEncontrada = match[1]; // "T"
            return emotionMap[letraEncontrada]; // Devuelve "tristeza"
        }
        
        return null;
    }

    // --- Asegúrate de actualizar también la función de filtrado ---
    
    function putSoundEmotion() {
        const selector = document.getElementById("currentEmotion");
        if (!selector) return;
        
        // Asegúrate de que los <option> en tu HTML tengan value="tristeza", value="calma", etc.
        currentEmotion = selector.value; 
        console.log("Emoción seleccionada:", currentEmotion);

        const audioPlayers = document.querySelectorAll("audio");
        if (audioPlayers.length === 0) return;

        // Lista de archivos (Siguen teniendo la letra T, C, F, I en el nombre)
        const availableAudios = [
            "/assets/frecuences/tone_110hz_20s T.wav", 
            "/assets/frecuences/tone_174hz_20s T.wav", 
            "/assets/frecuences/tone_210hz_20s T.wav", 
            "/assets/frecuences/tone_285hz_20s C.wav", 
            "/assets/frecuences/tone_396hz_20s C.wav", 
            "/assets/frecuences/tone_417hz_20s C.wav", 
            "/assets/frecuences/tone_440hz_20s F.wav", 
            "/assets/frecuences/tone_528hz_20s F.wav", 
            "/assets/frecuences/tone_639hz_20s F.wav", 
            "/assets/frecuences/tone_741hz_20s I.wav", 
            "/assets/frecuences/tone_852hz_20s I.wav", 
            "/assets/frecuences/tone_963hz_20s I.wav", 
        ];
        
        const matchingAudios = availableAudios.filter(audioPath => {
            // Aquí la función ya nos devuelve "tristeza", "calma", etc.
            const emotionWord = getEmotionCodeFromFileName(audioPath);
            
            // Comparamos "tristeza" === "tristeza"
            return emotionWord === currentEmotion;
        });

        if (matchingAudios.length === 0) {
            console.warn("No hay audios para:", currentEmotion);
            return;
        }
        
        audioPlayers.forEach((audioElement, index) => {
            const audioPath = matchingAudios[index % matchingAudios.length];
            audioElement.src = audioPath;
            audioElement.load(); 
        });
    }

    function handleSingleAudioPlay() {
        const audioPlayers = document.querySelectorAll("audio");
        audioPlayers.forEach(player => {
            player.removeEventListener('play', pauseOtherAudios);
            player.addEventListener('play', pauseOtherAudios);
        });
    }

    function pauseOtherAudios(event) {
        const currentPlayingAudio = event.target;
        const allAudios = document.querySelectorAll("audio");
        allAudios.forEach(audio => {
            if (audio !== currentPlayingAudio) {
                audio.pause();
            }
        });
    }

    // Inicialización de audios al cargar
    document.addEventListener("DOMContentLoaded", () => {
        const selector = document.getElementById("currentEmotion");
        if (selector) {
            selector.addEventListener("change", putSoundEmotion);
            putSoundEmotion(); // Carga inicial
        }
        handleSingleAudioPlay();
    });

    // 2. Navegación del Formulario (Siguiente / Atrás) -----------------------

    function handleConsent() {
        const val = document.getElementById("consent").value;
        if (val === "No") {
            alert("Es necesario aceptar el consentimiento para continuar.");
            return;
        }
        nextSection(1);
    }

    function nextSection(current) {
        document.getElementById("section" + current).style.display = "none";
        document.getElementById("section" + current).classList.remove("active");
        
        const next = document.getElementById("section" + (current + 1));
        if(next) {
            next.style.display = "block";
            next.classList.add("active");
        }
    }

    function previousSection(current) {
        document.getElementById("section" + current).style.display = "none";
        document.getElementById("section" + current).classList.remove("active");

        const prev = document.getElementById("section" + (current - 1));
        if(prev) {
            prev.style.display = "block";
            prev.classList.add("active");
        }
    }

    // 3. Envío de Datos (AQUÍ ESTÁ LA CORRECCIÓN CLAVE) ----------------------

    async function sendData() {
        //emociones a enviar por su frecuencia
        const EMOTION_FREQUENCIES = {
            tristeza: [110, 174, 210],
            calma: [285, 396, 417],
            felicidad: [440, 528, 639],
            ira: [741, 852, 963]
        };
        // A. Token
        const token = localStorage.getItem('token'); 
        if (!token) {
            alert("⚠️ Error: Sesión no iniciada.");
            // window.location.href = "index.html"; // Descomenta esto en producción
            return;
        }
        // --- 2. OBTENER LA EMOCIÓN ACTUAL ---
        const selectedEmotion = document.getElementById("currentEmotion").value; // ej: "tristeza"
        
        // Buscamos el array correspondiente. Si por error no existe, enviamos un array vacío []
        const frequenciesToSend = EMOTION_FREQUENCIES[selectedEmotion] || [];
        // B. Recopilar Géneros
        const genres = Array.from(
            document.querySelectorAll('.genreCheck:checked')
        ).map(x => x.value);

        const rawArtists = document.getElementById("currentArtist").value;
        
        // 2. Procesar: Cortar por comas -> Limpiar espacios -> Quitar vacíos
        const artistArray = rawArtists
            .split(',')                    // Crea el array
            .map(artist => artist.trim())  // Quita espacios extra: " dua lipa " -> "dua lipa"
            .filter(artist => artist !== "");
        
        const body = {
            // -- Campos Raíz (Root) --
            emotion: document.getElementById("currentEmotion").value,
            intensity: Number(document.getElementById("emotionIntensity").value),
            
            // -- Objeto Tones (Este sí coincide con la BD) --
            tones: {
                group: frequenciesToSend,
                molestias: {
                    tone1: Number(document.getElementById("molestia1").value),
                    tone2: Number(document.getElementById("molestia2").value),
                    tone3: Number(document.getElementById("molestia3").value)
                },
                favorite: document.getElementById("likedTone").value,
                least_favorite: document.getElementById("dislikedTone").value
            },

            // -- CORRECCIÓN: Campos sacados de "musicPreferences" a la raíz --
            genres: genres,
            artist_interest: artistArray,
            tempo_preference: document.getElementById("tempoPref").value,
            
            // -- CORRECCIÓN: intent --
            // Asegúrate de modificar el HTML (Paso 2 abajo) para que esto sea un número
            intent: Number(document.getElementById("emotionalGoal").value),
            
            // Nota: 'consent' no aparece en tu ejemplo de BD. 
            // Si el esquema de Mongoose lo permite, déjalo; si no, bórralo.
            consent: document.getElementById("consent").value === "Si"
        };

        console.log("📤 Enviando JSON Estructurado:", body);

        try {
            const response = await fetch(`${API_BASE_URL}/api/survey/register`, { // REVISA QUE ESTA RUTA SEA LA CORRECTA EN TU BACKEND
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}` 
                },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                // Muestra el mensaje exacto del servidor para depurar
                throw new Error(data.message || JSON.stringify(data));
            }

            console.log("✅ Guardado exitoso:", data);
            alert("Preferencias guardadas correctamente!");
            window.location.href = "results.html";
            

        } catch (err) {
            console.error("❌ Error al guardar:", err);
            alert("Error al guardar: " + err.message);
        }
    }
</script>

</body>
</html>
