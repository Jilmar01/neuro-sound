<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Musical Personalizado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/form.css">
    <style>
        audio { width: 100%; margin-bottom: 10px; }
        .genre-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>

<body>

<div class="container mt-5 mb-5">

    <div id="section1" class="section active">
        <div class="card p-4 shadow">
            <h2>1. Consentimiento</h2>
            <div class="question mt-3">
                <label class="form-label">¿Acepta que sus respuestas se utilicen para personalizar su experiencia musical?</label>
                <select id="consent" class="form-select">
                    <option value="Si">Sí</option>
                    <option value="No">No</option>
                </select>
            </div>
            <button class="btn btn-primary mt-4" onclick="handleConsent()">Siguiente</button>
        </div>
    </div>

    <div id="section2" class="section">
        <div class="card p-4 shadow">
            <button class="btn btn-outline-secondary btn-sm mb-3" onclick="previousSection(2)"><i class="bi bi-arrow-left"></i> Atrás</button>
            <h2>2. Estado Emocional</h2>

            <div class="question mb-4">
                <label class="form-label">2.1 ¿Cómo se siente en este momento?</label>
                <select id="currentEmotion" class="form-select">
                    <option value="tristeza">Tristeza</option>
                    <option value="calma">Calma</option>
                    <option value="felicidad">Felicidad</option>
                    <option value="molestia">Molestia</option>
                </select>
            </div>

            <div class="question mb-3">
                <label class="form-label">2.2 Intensidad de la emoción (1: muy leve, 5: muy fuerte)</label>
                <input id="emotionIntensity" type="range" class="form-range" min="1" max="5" step="1" value="3" oninput="document.getElementById('intensityVal').innerText = this.value">
                <div class="text-center fw-bold fs-4" id="intensityVal">3</div>
            </div>

            <button class="btn btn-primary w-100" onclick="nextSection(2)">Siguiente</button>
        </div>
    </div>

    <div id="section3" class="section">
        <div class="card p-4 shadow">
            <button class="btn btn-outline-secondary btn-sm mb-3" onclick="previousSection(3)"><i class="bi bi-arrow-left"></i> Atrás</button>
            <h2>3. Test de Tonos Puros (Hz)</h2>
            <p class="text-muted small">Escuche los tonos según su emoción actual y califique su molestia.</p>

            <div id="tonesContainer">
                <div class="mb-4 p-3 border rounded bg-light">
                    <strong>Tono 1:</strong>
                    <audio id="audio1" controls class="mb-2"></audio>
                    <label class="form-label small">Nivel de molestia (1-5):</label>
                    <select id="molestia1" class="form-select molestia-input">
                        <option value="1">1 (Mínima)</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5 (Máxima)</option>
                    </select>
                </div>
                <div class="mb-4 p-3 border rounded bg-light">
                    <strong>Tono 2:</strong>
                    <audio id="audio2" controls class="mb-2"></audio>
                    <label class="form-label small">Nivel de molestia (1-5):</label>
                    <select id="molestia2" class="form-select molestia-input">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
                <div class="mb-4 p-3 border rounded bg-light">
                    <strong>Tono 3:</strong>
                    <audio id="audio3" controls class="mb-2"></audio>
                    <label class="form-label small">Nivel de molestia (1-5):</label>
                    <select id="molestia3" class="form-select molestia-input">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">¿Qué tono le resultó mejor?</label>
                    <select id="likedTone" class="form-select">
                        <option value="tone 1">Tono 1</option>
                        <option value="tone 2">Tono 2</option>
                        <option value="tone 3">Tono 3</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">¿Qué tono le resultó peor?</label>
                    <select id="dislikedTone" class="form-select">
                        <option value="tone 1">Tono 1</option>
                        <option value="tone 2">Tono 2</option>
                        <option value="tone 3">Tono 3</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary w-100" onclick="nextSection(3)">Siguiente</button>
        </div>
    </div>

    <div id="section4" class="section">
        <div class="card p-4 shadow">
            <button class="btn btn-outline-secondary btn-sm mb-3" onclick="previousSection(4)"><i class="bi bi-arrow-left"></i> Atrás</button>
            <h2>4. Gustos Musicales</h2>

            <div class="question mb-4">
                <label class="form-label fw-bold">Seleccione los géneros que le gustan:</label>
                <div class="genre-grid" id="genreContainer">
                    </div>
            </div>

            <div class="question mb-4">
                <label class="form-label fw-bold">Sus artistas favoritos:</label>
                <input type="text" id="artistPreference" class="form-control" placeholder="Ej: Soda Stereo, Daft Punk, Bad Bunny">
                <div class="form-text">Sepárelos con comas para identificarlos correctamente.</div>
            </div>

            <div class="question mb-4">
                <label class="form-label fw-bold">Preferencia de ritmo (Tempo):</label>
                <select id="tempoPref" class="form-select">
                    <option value="lentas y tranquilas">Lentas y tranquilas</option>
                    <option value="ritmo moderado">Ritmo moderado</option>
                    <option value="rapidas y animadas">Rápidas y animadas</option>
                </select>
            </div>

            <button class="btn btn-primary w-100" onclick="nextSection(4)">Siguiente</button>
        </div>
    </div>

    <div id="section5" class="section">
        <div class="card p-4 shadow">
            <button class="btn btn-outline-secondary btn-sm mb-3" onclick="previousSection(5)"><i class="bi bi-arrow-left"></i> Atrás</button>
            <h2>5. Intención de la Sesión</h2>

            <div class="question mb-4">
                <label class="form-label">¿Qué desea lograr con esta sesión musical?</label>
                <select id="emotionalGoal" class="form-select">
                    <option value="1">Mantener cómo me siento</option>
                    <option value="2">Sentirme más feliz</option>
                    <option value="3">Relajarme</option>
                    <option value="4">Aumentar mi energía</option>
                    <option value="5">Ayudarme a concentrarme</option>
                </select>
            </div>

            <button class="btn btn-success btn-lg w-100" onclick="sendData()">Finalizar y Enviar</button>
        </div>
    </div>

</div>

<script src="/js/config.js"></script>
<script>
    // --- MAPAS DE DATOS SEGÚN DEFINICIÓN ---
    const GENRES_LIST = ["Indie", "Reggaeton", "Rock", "Pop", "Electronica", "Hip-Hop", "RnB", "salsa", "cumbia", "balada"];
    
    const TONE_GROUPS = {
        "tristeza": [110, 174, 210],
        "calma": [285, 396, 417],
        "felicidad": [440, 528, 639],
        "molestia": [741, 852, 963]
    };

    // Mapeo para nombres de archivos (Mantenemos coherencia con tu lógica de letras)
    const emotionFileMap = {
        "tristeza": "T",
        "calma": "C",
        "felicidad": "F",
        "molestia": "I" // Ira/Molestia
    };

    // --- INICIALIZACIÓN ---
    document.addEventListener("DOMContentLoaded", () => {
        renderGenres();
        const emotionSelector = document.getElementById("currentEmotion");
        emotionSelector.addEventListener("change", updateAudioTones);
        updateAudioTones(); // Carga inicial
        setupAudioSinglePlay();
    });

    function renderGenres() {
        const container = document.getElementById("genreContainer");
        container.innerHTML = GENRES_LIST.map(genre => `
            <div class="form-check">
                <input class="form-check-input genre-check" type="checkbox" value="${genre}" id="genre_${genre}">
                <label class="form-check-label" for="genre_${genre}">${genre}</label>
            </div>
        `).join('');
    }

    function updateAudioTones() {
        const selectedEmotion = document.getElementById("currentEmotion").value;
        const letter = emotionFileMap[selectedEmotion];
        const frequencies = TONE_GROUPS[selectedEmotion];
        
        const audioPlayers = document.querySelectorAll("audio");
        audioPlayers.forEach((player, index) => {
            const freq = frequencies[index];
            // Ruta dinámica basada en frecuencia y letra
            player.src = `/assets/frecuences/tone_${freq}hz_20s ${letter}.wav`;
            player.load();
        });
    }

    function setupAudioSinglePlay() {
        const audios = document.querySelectorAll("audio");
        audios.forEach(a => {
            a.addEventListener('play', (e) => {
                audios.forEach(other => { if(other !== e.target) other.pause(); });
            });
        });
    }

    // --- NAVEGACIÓN ---
    function handleConsent() {
        if (document.getElementById("consent").value === "No") {
            alert("Debe aceptar el consentimiento para continuar.");
            return;
        }
        nextSection(1);
    }

    function nextSection(current) {
        document.getElementById(`section${current}`).classList.remove("active");
        document.getElementById(`section${current + 1}`).classList.add("active");
        window.scrollTo(0,0);
    }

    function previousSection(current) {
        document.getElementById(`section${current}`).classList.remove("active");
        document.getElementById(`section${current - 1}`).classList.add("active");
    }

    // --- ENVÍO DE DATOS ---
    async function sendData() {
        const token = localStorage.getItem('token');
        if (!token) { alert("Sesión no válida"); return; }

        const selectedEmotion = document.getElementById("currentEmotion").value;

        // Construcción del objeto según tu esquema
        const body = {
            emotion: selectedEmotion,
            intensity: Number(document.getElementById("emotionIntensity").value),
            tones: {
                group: TONE_GROUPS[selectedEmotion],
                molestias: {
                    tone1: Number(document.getElementById("molestia1").value),
                    tone2: Number(document.getElementById("molestia2").value),
                    tone3: Number(document.getElementById("molestia3").value)
                },
                favorite: document.getElementById("likedTone").value,
                least_favorite: document.getElementById("dislikedTone").value
            },
            genres: Array.from(document.querySelectorAll('.genre-check:checked')).map(cb => cb.value),
            artist_preference: document.getElementById("artistPreference").value
                .split(',')
                .map(a => a.trim())
                .filter(a => a !== ""),
            tempo_preference: document.getElementById("tempoPref").value,
            intent: Number(document.getElementById("emotionalGoal").value)
        };

        console.log("📤 Datos a enviar:", body);

        try {
            const response = await fetch(`${API_BASE_URL}/api/survey/register`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                alert("¡Datos guardados con éxito!");
                window.location.href = "results.html";
            } else {
                const errorData = await response.json();
                alert("Error: " + (errorData.message || "No se pudo guardar"));
            }
        } catch (err) {
            console.error(err);
            alert("Error de conexión al servidor");
        }
    }
</script>
</body>
</html>
