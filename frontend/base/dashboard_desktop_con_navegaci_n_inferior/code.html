<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>NeuroSound - Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Subtle glow animation for the play state */
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(227, 242, 253, 0.4); } /* primary-container */
            70% { box-shadow: 0 0 0 20px rgba(227, 242, 253, 0); }
            100% { box-shadow: 0 0 0 0 rgba(227, 242, 253, 0); }
        }
        .animate-subtle-pulse {
            animation: subtlePulse 3s infinite;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#606f78",
                        "tertiary": "#625f4d",
                        "tertiary-container": "#f7f0d9",
                        "surface-tint": "#526069",
                        "tertiary-fixed-dim": "#ccc6b1",
                        "outline": "#73787b",
                        "on-primary-fixed": "#0f1d25",
                        "on-tertiary-container": "#716d5b",
                        "on-tertiary-fixed": "#1e1c0e",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d4e6e5",
                        "error": "#ba1a1a",
                        "surface": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e0e3e5",
                        "primary": "#526069",
                        "on-background": "#191c1e",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#d6e5ef",
                        "on-surface-variant": "#43474a",
                        "on-secondary-fixed-variant": "#3a4a49",
                        "primary-fixed-dim": "#bac9d3",
                        "inverse-surface": "#2d3133",
                        "surface-variant": "#e0e3e5",
                        "inverse-on-surface": "#eff1f3",
                        "on-error": "#ffffff",
                        "background": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#4a4737",
                        "on-surface": "#191c1e",
                        "secondary-container": "#d4e6e5",
                        "on-secondary-fixed": "#0e1e1e",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#e9e2cc",
                        "surface-dim": "#d8dadc",
                        "surface-container": "#eceef0",
                        "surface-bright": "#f7f9fb",
                        "outline-variant": "#c3c7cb",
                        "secondary": "#516161",
                        "secondary-fixed-dim": "#b8cac9",
                        "on-secondary-container": "#576867",
                        "primary-container": "#e3f2fd",
                        "on-primary-fixed-variant": "#3b4951",
                        "inverse-primary": "#bac9d3",
                        "on-primary": "#ffffff"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "gutter": "24px",
                        "section-gap": "80px",
                        "container-padding-desktop": "64px",
                        "container-padding-mobile": "24px",
                        "unit": "8px"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "label-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen relative overflow-x-hidden pb-20">
<!-- Loading State Overlay -->
<div class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-surface/95 backdrop-blur-2xl transition-opacity duration-1000" id="loading-overlay">
<div class="w-16 h-16 rounded-full border-2 border-primary-container border-t-primary animate-spin mb-8"></div>
<p class="font-body-lg text-body-lg text-on-surface-variant animate-pulse">Afinando las frecuencias para ti...</p>
</div>
<!-- Background Atmospheric Gradient (Soft Blues for Relaxation) -->
<div class="absolute inset-0 pointer-events-none bg-gradient-to-b from-primary-container/30 to-surface z-0"></div>
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl docked full-width top-0 sticky flex justify-between items-center w-full px-container-padding-mobile md:px-container-padding-desktop py-unit mx-auto z-50 border-b border-surface-container-highest">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile font-semibold tracking-tight text-on-surface dark:text-on-surface-variant">NeuroSound</h1>
</div>
<div class="flex items-center gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-70 transition-opacity duration-300">
<span class="material-symbols-outlined text-2xl">settings</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-70 transition-opacity duration-300">
<span class="material-symbols-outlined text-2xl">account_circle</span>
</button>
</div>
</header>
<!-- Main Player Canvas -->
<main class="relative z-10 flex flex-col md:flex-row gap-8 lg:gap-24 items-center md:items-start justify-center w-full max-w-[1200px] mx-auto px-container-padding-mobile md:px-container-padding-desktop min-h-[calc(100vh-160px)] pb-12 pt-8 md:pt-16">
<!-- Left Column: Player Focus -->
<div class="w-full md:w-1/2 flex flex-col items-center justify-center">
<!-- Album Art / Visualizer -->
<div class="w-64 h-64 md:w-80 md:h-80 rounded-full bg-surface-container-high shadow-[0_32px_64px_-12px_rgba(0,0,0,0.05)] overflow-hidden mb-10 relative flex items-center justify-center group animate-subtle-pulse">
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="A serene, abstract macro photograph of softly rippling water in pale blue and white tones. The lighting is ethereal and diffused, creating a calming, clinical yet organic texture. The image perfectly embodies extreme minimalism, evoking a sense of mental clarity, gentle movement, and therapeutic breathing space without any harsh lines or distractions." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDjwpnpx7xR1WpHvUx8LUi2gZ6v3_Kwo235vwHux1GFHRpvFfQgjc2hroz00aWkf76aKfexB3-HFEXyhN2-Wy1ni3zOuFba7NYyKc2EMXafI-CRCKi0R-O4VOi-UV4RujbFto4TrVuUyWXycomJutNpNaFzSZiru9KDz_NHGhQPrrN7hXcoQHo_3jDu_TgYMvWJIM4Er55XPC16u_-gYPPUmlV4pzhcDWP0AD35dcMjy623l5HayeAwHKjVInj3G_fcubP6AACMrUo');"></div>
<!-- Glassy overlay -->
<div class="absolute inset-0 bg-gradient-to-tr from-surface/20 to-transparent"></div>
</div>
<!-- Track Info -->
<div class="text-center mb-8 w-full max-w-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Frecuencias de Calma Profunda</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Ondas Theta 432Hz</p>
</div>
<!-- Psychoacoustic Metadata (Soft Bars) -->
<div class="w-full max-w-sm flex flex-col gap-4 mb-10 px-4">
<!-- Energía -->
<div class="flex items-center gap-4">
<span class="font-label-sm text-label-sm text-on-surface-variant w-20 text-right">Energía</span>
<div class="flex-1 h-2 rounded-full bg-surface-container-highest overflow-hidden">
<div class="h-full bg-primary-container w-1/3 rounded-full"></div>
</div>
</div>
<!-- Valencia -->
<div class="flex items-center gap-4">
<span class="font-label-sm text-label-sm text-on-surface-variant w-20 text-right">Valencia</span>
<div class="flex-1 h-2 rounded-full bg-surface-container-highest overflow-hidden">
<div class="h-full bg-secondary-fixed w-3/4 rounded-full"></div>
</div>
</div>
<!-- Tempo -->
<div class="flex items-center gap-4">
<span class="font-label-sm text-label-sm text-on-surface-variant w-20 text-right">Tempo</span>
<div class="flex-1 h-2 rounded-full bg-surface-container-highest overflow-hidden">
<div class="h-full bg-tertiary-container w-1/4 rounded-full"></div>
</div>
</div>
</div>
<!-- Player Controls -->
<div class="flex items-center justify-center gap-8 mb-8 md:mb-0">
<button class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-3xl">skip_previous</span>
</button>
<button class="w-20 h-20 flex items-center justify-center rounded-full bg-primary text-on-primary shadow-[0_16px_32px_-8px_rgba(82,96,105,0.2)] hover:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-4xl filled">play_arrow</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-3xl">skip_next</span>
</button>
</div>
</div>
<!-- Right Column: Context & Feedback -->
<div class="w-full md:w-1/2 flex flex-col items-center md:items-start justify-center pt-4 md:pt-12">
<!-- Intervention Feedback -->
<section class="w-full max-w-md mt-4 mb-10">
<h3 class="font-headline-md text-headline-md text-on-surface mb-6 text-center md:text-left">Selección Personalizada</h3>
<div class="flex flex-col gap-4">
<!-- Recommended Item 1 -->
<div class="flex items-center p-3 rounded-2xl hover:bg-surface-container transition-colors duration-300 cursor-pointer group">
<div class="w-14 h-14 rounded-xl bg-surface-container-highest flex-shrink-0 overflow-hidden relative">
<div class="absolute inset-0 bg-primary-container/20"></div>
</div>
<div class="ml-4 flex-1">
<p class="font-body-md font-medium text-on-surface">Serenidad Estelar</p>
<p class="text-sm text-on-surface-variant">Ondas Delta</p>
</div>
<div class="px-3 py-1 rounded-full bg-secondary-container/50 text-on-secondary-container text-xs font-medium">
                            Calma
                        </div>
</div>
<!-- Recommended Item 2 -->
<div class="flex items-center p-3 rounded-2xl hover:bg-surface-container transition-colors duration-300 cursor-pointer group">
<div class="w-14 h-14 rounded-xl bg-surface-container-highest flex-shrink-0 overflow-hidden relative">
<div class="absolute inset-0 bg-tertiary-container/20"></div>
</div>
<div class="ml-4 flex-1">
<p class="font-body-md font-medium text-on-surface">Flujo de Trabajo</p>
<p class="text-sm text-on-surface-variant">Ruido Rosa</p>
</div>
<div class="px-3 py-1 rounded-full bg-tertiary-container text-on-tertiary-container text-xs font-medium">
                            Foco
                        </div>
</div>
<!-- Recommended Item 3 -->
<div class="flex items-center p-3 rounded-2xl hover:bg-surface-container transition-colors duration-300 cursor-pointer group">
<div class="w-14 h-14 rounded-xl bg-surface-container-highest flex-shrink-0 overflow-hidden relative">
<div class="absolute inset-0 bg-primary-fixed/20"></div>
</div>
<div class="ml-4 flex-1">
<p class="font-body-md font-medium text-on-surface">Respiro Consciente</p>
<p class="text-sm text-on-surface-variant">Atmósfera Zen</p>
</div>
<div class="px-3 py-1 rounded-full bg-secondary-container/50 text-on-secondary-container text-xs font-medium">
                            Zen
                        </div>
</div>
</div>
</section>
<div class="w-full max-w-md flex gap-4 justify-center md:justify-start mt-auto">
<button class="flex-1 py-4 px-6 rounded-full border border-outline-variant text-on-surface-variant font-body-md text-body-md flex justify-center items-center gap-2 hover:bg-surface-container transition-colors duration-300">
<span>No me ayuda</span>
<span class="material-symbols-outlined text-xl">thumb_down</span>
</button>
<button class="flex-1 py-4 px-6 rounded-full border border-primary-container bg-primary-container/30 text-on-primary-container font-body-md text-body-md flex justify-center items-center gap-2 hover:bg-primary-container transition-colors duration-300">
<span>Me ayuda</span>
<span class="material-symbols-outlined text-xl">thumb_up</span>
</button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-surface-container flex justify-center items-center h-[80px] z-50">
<div class="flex items-center justify-around w-full max-w-[600px] px-4">
<button class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:bg-surface-container-highest rounded-full px-4 py-1 transition-all duration-300">insights</span>
<span class="text-xs font-medium font-label-sm">Análisis</span>
</button>
<button class="flex flex-col items-center justify-center w-20 h-full text-on-primary-container transition-colors">
<div class="bg-primary-container rounded-full px-5 py-1 mb-1">
<span class="material-symbols-outlined text-2xl text-on-primary-container filled">library_music</span>
</div>
<span class="text-xs font-medium font-label-sm">Biblioteca</span>
</button>
<button class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:bg-surface-container-highest rounded-full px-4 py-1 transition-all duration-300">assignment</span>
<span class="text-xs font-medium font-label-sm">Encuesta</span>
</button>
<button class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:bg-surface-container-highest rounded-full px-4 py-1 transition-all duration-300">settings</span>
<span class="text-xs font-medium font-label-sm">Ajustes</span>
</button>
</div>
</nav>
<script>
        // Handle Loading State removal
        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.getElementById('loading-overlay');
            if (loader) {
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 1000); // Wait for transition
                }, 2000); // 2 seconds loading phase
            }
        });
    </script>
</body></html>
