<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Subtle glow animation for results */
        @keyframes softGlow {
            0% { box-shadow: 0 0 0 0 rgba(82, 96, 105, 0.1); }
            50% { box-shadow: 0 0 32px 8px rgba(82, 96, 105, 0.15); }
            100% { box-shadow: 0 0 0 0 rgba(82, 96, 105, 0.1); }
        }
        .animate-glow {
            animation: softGlow 4s infinite ease-in-out;
        }

        /* Bar animation */
        @keyframes fillBar {
            from { width: 0%; opacity: 0; }
            to { opacity: 1; }
        }
        .bar-animate {
            animation: fillBar 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen antialiased flex flex-col items-center justify-center py-12 px-container-padding-mobile md:px-container-padding-desktop selection:bg-primary-container selection:text-on-primary-container pb-[100px]">
<main class="w-full max-w-[600px] flex flex-col gap-12 relative z-10">
<!-- Header -->
<header class="text-center space-y-4">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface tracking-tight">
                ¿Cómo te sientes ahora?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Evalúa tu estado tras la sintonía.
            </p>
</header>
<!-- Likert Scale Input -->
<section class="flex flex-col gap-8 w-full bg-surface-container-lowest p-8 rounded-xl shadow-[0_32px_64px_-12px_rgba(0,0,0,0.02)] border border-surface-container-low">
<div class="flex justify-between items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined text-3xl">sentiment_dissatisfied</span>
<span class="material-symbols-outlined text-3xl">sentiment_satisfied</span>
</div>
<div class="relative w-full h-16 flex items-center">
<!-- Track background -->
<div class="absolute w-full h-2 bg-surface-container rounded-full top-1/2 -translate-y-1/2 z-0"></div>
<!-- Touch targets -->
<div class="relative z-10 w-full flex justify-between">
<button aria-label="Nivel 1" class="w-12 h-12 rounded-full bg-surface-container hover:bg-surface-variant transition-colors flex items-center justify-center focus:outline-none focus:ring-4 ring-primary/20"></button>
<button aria-label="Nivel 2" class="w-12 h-12 rounded-full bg-surface-container hover:bg-surface-variant transition-colors flex items-center justify-center focus:outline-none focus:ring-4 ring-primary/20"></button>
<button aria-label="Nivel 3" class="w-12 h-12 rounded-full bg-surface-container hover:bg-surface-variant transition-colors flex items-center justify-center focus:outline-none focus:ring-4 ring-primary/20"></button>
<button aria-label="Nivel 4" class="w-12 h-12 rounded-full bg-primary text-on-primary shadow-lg ring-4 ring-primary/20 flex items-center justify-center focus:outline-none">
<span class="material-symbols-outlined icon-fill text-sm">circle</span>
</button>
<button aria-label="Nivel 5" class="w-12 h-12 rounded-full bg-surface-container hover:bg-surface-variant transition-colors flex items-center justify-center focus:outline-none focus:ring-4 ring-primary/20"></button>
</div>
</div>
<div class="flex justify-between text-on-surface-variant font-label-sm text-label-sm px-2">
<span>Tenso</span>
<span>Relajado</span>
</div>
</section>
<!-- Results Visualization -->
<section class="flex flex-col gap-6 w-full bg-surface-container-low p-8 rounded-xl relative overflow-hidden animate-glow">
<!-- Decorative blur element behind card -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-primary-container rounded-full blur-3xl opacity-30 mix-blend-multiply"></div>
<div class="relative z-10 text-center mb-4">
<h2 class="font-headline-md text-headline-md text-primary font-medium">
                    Tu estrés bajó un 40%
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">
                    Excelente progreso en esta sesión.
                </p>
</div>
<div class="relative z-10 flex flex-col gap-6 w-full mt-4">
<!-- Bar Before -->
<div class="flex flex-col gap-2">
<div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant">
<span>Antes</span>
<span>Nivel 8</span>
</div>
<div class="w-full h-3 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-outline-variant rounded-full w-[80%] opacity-60"></div>
</div>
</div>
<!-- Bar After -->
<div class="flex flex-col gap-2">
<div class="flex justify-between font-label-sm text-label-sm text-primary font-semibold">
<span>Ahora</span>
<span>Nivel 4</span>
</div>
<div class="w-full h-3 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full bar-animate" style="width: 40%;"></div>
</div>
</div>
</div>
</section>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-8">
<button class="w-full py-4 px-8 bg-primary text-on-primary rounded-full font-label-sm text-label-sm uppercase tracking-widest hover:bg-primary/90 transition-all duration-300 shadow-[0_8px_24px_-8px_rgba(82,96,105,0.4)] flex items-center justify-center gap-2">
                Finalizar Sesión
                <span class="material-symbols-outlined text-lg">check_circle</span>
</button>
<button class="w-full py-4 px-8 bg-transparent text-primary border border-outline/30 rounded-full font-label-sm text-label-sm uppercase tracking-widest hover:bg-surface-variant transition-colors duration-300">
                Nueva Sintonía
            </button>
</div>
</main>
<script>
        // Simple script to trigger the bar animation on load for a smooth effect
        document.addEventListener('DOMContentLoaded', () => {
            const bars = document.querySelectorAll('.bar-animate');
            bars.forEach(bar => {
                // Ensure the animation triggers cleanly
                bar.style.animation = 'none';
                bar.offsetHeight; /* trigger reflow */
                bar.style.animation = null; 
            });
        });
    </script>
<nav class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-surface-container flex justify-center items-center h-[80px] z-50">
<div class="flex items-center justify-around w-full max-w-[600px] px-4">

<span class="material-symbols-outlined text-2xl mb-1 group-hover:bg-surface-container-highest rounded-full px-4 py-1 transition-all duration-300">insights</span>

<button class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors group">

</button>
</div>
</nav></body></html>
