            height: 600px;

            left: -200px;
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }

            right: -100px;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }
