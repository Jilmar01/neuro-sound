<body class="min-h-screen flex flex-col items-center justify-center font-body-md bg-surface antialiased pb-20">
<!-- Main Content Canvas -->
<main class="w-full max-w-[1024px] mx-auto px-container-padding-mobile md:px-container-padding-desktop py-section-gap flex flex-col items-center flex-grow justify-center">
<!-- Header -->

</header>
<!-- Likert Scales Form -->
<form class="w-full max-w-xl flex flex-col gap-12 mb-[104px]" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Metric: Ansiedad -->

<div class="flex justify-between items-end mb-6">

<!-- Track Background -->

<!-- Track Fill -->

<!-- Nodes -->
<div class="relative w-full flex justify-between items-center z-10 px-2">
<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-primary-container" data-value="1" onclick="selectValue('ansiedad', 1)" type="button">

</button>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_dissatisfied</span>
</button>
<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-primary-container" data-value="4" onclick="selectValue('ansiedad', 4)" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sentiment_very_dissatisfied</span>
</button>
<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-primary-container" data-value="5" onclick="selectValue('ansiedad', 5)" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sick</span>
</button>
</div>
</div>
<div class="flex justify-between mt-2 px-4">
<span class="font-label-sm text-label-sm text-outline">Baja</span>
<span class="font-label-sm text-label-sm text-outline">Alta</span>
</div>

</div>
<!-- Metric: Estrés -->

<div class="relative w-full h-16 flex items-center">

<!-- Track Fill -->

<!-- Nodes -->

<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-secondary-container" data-value="1" onclick="selectValue('estres', 1)" type="button">

<button class="scale-node active w-12 h-12 rounded-full bg-primary flex items-center justify-center text-on-primary cursor-pointer focus:outline-none focus:ring-4 focus:ring-secondary-container" data-value="2" onclick="selectValue('estres', 2)" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">airwave</span>

<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-secondary-container" data-value="3" onclick="selectValue('estres', 3)" type="button">

<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-secondary-container" data-value="4" onclick="selectValue('estres', 4)" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">crisis_alert</span>
</button>
<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-secondary-container" data-value="5" onclick="selectValue('estres', 5)" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">warning</span>
</button>
</div>
</div>
<div class="flex justify-between mt-2 px-4">
<span class="font-label-sm text-label-sm text-outline">Relajado</span>

<button class="scale-node active w-12 h-12 rounded-full bg-primary flex items-center justify-center text-on-primary cursor-pointer focus:outline-none focus:ring-4 focus:ring-primary-container" data-value="1" onclick="selectValue('tristeza', 1)" type="button">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">partly_cloudy_day</span>

<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-primary-container" data-value="3" onclick="selectValue('tristeza', 3)" type="button">

<button class="scale-node w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant cursor-pointer hover:bg-surface-variant focus:outline-none focus:ring-4 focus:ring-primary-container" data-value="4" onclick="selectValue('tristeza', 4)" type="button">

<div class="flex justify-between mt-2 px-4">

<!-- Submit Button -->
<div class="mt-8 flex justify-center w-full">
<button class="w-full md:w-auto min-w-[240px] h-16 rounded-full bg-primary text-on-primary font-headline-md text-headline-md hover:bg-primary/90 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-primary-container shadow-[0_8px_32px_-8px_rgba(82,96,105,0.3)] hover:shadow-[0_16px_48px_-12px_rgba(82,96,105,0.4)] hover:-translate-y-1 flex items-center justify-center gap-3" type="submit">

<span class="material-symbols-outlined text-2xl mb-1 group-hover:bg-surface-container-highest rounded-full px-4 py-1 transition-all duration-300">insights</span>
<span class="text-xs font-medium font-label-sm">Análisis</span>
</button>
<button class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:bg-surface-container-highest rounded-full px-4 py-1 transition-all duration-300">library_music</span>
<span class="text-xs font-medium font-label-sm">Biblioteca</span>
</button>
<button class="flex flex-col items-center justify-center w-20 h-full text-on-primary-container transition-colors">
<div class="bg-primary-container rounded-full px-5 py-1 mb-1">
<span class="material-symbols-outlined text-2xl text-on-primary-container filled">assignment</span>
</div>
<span class="text-xs font-medium font-label-sm">Encuesta</span>
</button>
<button class="flex flex-col items-center justify-center w-20 h-full text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-2xl mb-1 group-hover:bg-surface-container-highest rounded-full px-4 py-1 transition-all duration-300">settings</span>
<span class="text-xs font-medium font-label-sm">Ajustes</span>
</button>
</div>
</nav>
<script>
        const labels = {
            ansiedad: ["Baja", "Leve", "Moderada", "Alta", "Severa"],
            estres: ["Nulo", "Leve", "Moderado", "Alto", "Severo"],
            tristeza: ["Nula", "Leve", "Moderada", "Alta", "Severa"]
        };

        function selectValue(metric, value) {
            const container = document.querySelector(`.metric-container[data-metric="${metric}"]`);
            const input = document.getElementById(`input-${metric}`);
            const labelSpan = document.getElementById(`label-${metric}`);
            const nodes = container.querySelectorAll('.scale-node');
            const trackFill = container.querySelector('.scale-track-fill');

            // Update input value
            input.value = value;
            
            // Update text label
            labelSpan.textContent = labels[metric][value - 1];

            // Calculate percentage for track fill (0% for value 1, 100% for value 5)
            const percentage = ((value - 1) / 4) * 100;
            trackFill.style.width = `${percentage}%`;

            // Reset all nodes in this metric
            nodes.forEach(node => {
                node.classList.remove('active', 'bg-primary', 'text-on-primary');
                node.classList.add('bg-surface-container', 'text-on-surface-variant');
                
                // Reset icon fill
                const icon = node.querySelector('.material-symbols-outlined');
                if (icon) {
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
            });

            // Set active node
            const activeNode = container.querySelector(`.scale-node[data-value="${value}"]`);
            activeNode.classList.remove('bg-surface-container', 'text-on-surface-variant');
            activeNode.classList.add('active', 'bg-primary', 'text-on-primary');
            
            // Fill icon on active
            const activeIcon = activeNode.querySelector('.material-symbols-outlined');
            if (activeIcon) {
                activeIcon.style.fontVariationSettings = "'FILL' 1";
            }
            
            // Optional: Haptic feedback for mobile
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }
    </script>
</body></html>
