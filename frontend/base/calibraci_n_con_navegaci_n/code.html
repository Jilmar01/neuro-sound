<style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom range slider styling for minimal ghost-look */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -14px; /* offset for track height */
            box-shadow: 0 0 20px rgba(82,96,105,0.15);
            border: 1px solid #c3c7cb;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        input[type=range]:focus::-webkit-slider-thumb {
            box-shadow: 0 0 24px rgba(82,96,105,0.3);
            border-color: #526069;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #eceef0;
            border-radius: 9999px;
        }
        /* Fill effect handled via JS/CSS var below */
        .slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .slider-fill {
            position: absolute;
            height: 4px;
            background: #526069;
            border-radius: 9999px;
            pointer-events: none;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            width: 45%; /* Default value */
            transition: width 0.1s;
        }
    </style>

<script>
        // Simple JS to update the custom slider fill
        const slider = document.getElementById('volumeSlider');
        const fill = document.getElementById('volumeFill');

        slider.addEventListener('input', (e) => {
            const value = e.target.value;
            fill.style.width = value + '%';
        });
    </script>
