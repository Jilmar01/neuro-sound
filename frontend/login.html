<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Sound Log-in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="Styles/login.css">

</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="Login">
                    <div class="logocontainer">
                        <img src="img/logo.png" alt="logo">
                        <h1>Neuro-Sound</h1>
                    </div>
                    <h1 class="text-center mb-4">Sign in</h1>

                    <!-- 🚀 AHORA EL FORM TIENE ID -->
                    <form id="loginForm">
                        <label for="email">Correo</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            
                            <!-- 🚀 CAMBIADO A EMAIL -->
                            <input type="email" class="form-control" name="email" id="email" placeholder="Ingrese su correo">
                        </div>

                        <label for="password">Contraseña</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control" name="password" id="password" placeholder="Ingresa tu contraseña">
                        </div>

                        <button class="btn btn-success w-100" type="submit">Iniciar Sesión</button>
                        <p class="text-center">¿No tienes cuenta aun?, Créala <a href="signup.html">Aquí</a></p>
                    </form>

                </div>
            </div>
        </div>
    </div>
    <script src="js/config.js"></script>

<script>
    if (window.location.hostname === 'localhost') {
    // Reemplaza 'localhost' por '127.0.0.1' en la URL y recarga
    window.location.href = window.location.href.replace('localhost', '127.0.0.1');
    }
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("https://8nlqb9lj-5000.use2.devtunnels.ms/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                // ❌ QUITAMOS credentials: "include" (Ya no usamos cookies)
                body: JSON.stringify({ email, password})
            });

            const data = await response.json();

            if (!response.ok) {
                console.error("Error del servidor:", data);
                alert(data.message || "Credenciales inválidas"); 
                return;
            }

            // --- MOMENTO DE LA VERDAD ---
            console.log("Respuesta del servidor:", data); // <--- MIRA ESTO EN CONSOLA

            // Verificamos si el token vino en 'data.token' o 'data.data.token'
            // Ajusta esto según lo que veas en el console.log
            const tokenRecibido = data.data.token; 

            if (tokenRecibido) {
                localStorage.setItem('token', tokenRecibido);
                console.log("✅ Token guardado exitosamente:", tokenRecibido);
                alert("Inicio de sesión exitoso");

                // Redirección
                const formDo = data.data.user.form;
                console.log("Valor de formDo:", formDo);
                //alert("Inicio de sesión exitoso");
                
                if (formDo) {
                    window.location.href = "home.html";
                } else {
                    window.location.href = "cuestionario.html"; 
                }
                
            } else {
                console.error("⚠️ El servidor respondió OK, pero no envió el token en el JSON.");
                alert("Error: No se recibió el token de seguridad.");
            }
            
        } catch (error) {
            console.error("Error de red:", error); 
            alert("Error al conectar con el servidor");
        }
    });
</script>

</body>
</html>
